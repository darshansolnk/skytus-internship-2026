<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>📝 My Todo List</h1>

    <form id="todoForm">
      <input type="text" id="todoInput" placeholder="Enter your task..." />
      <button type="submit">Add</button>
    </form>

    <p id="error"></p>

    <ul id="todoList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
